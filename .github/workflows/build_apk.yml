name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java Environment einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter SDK einrichten
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Android-Ordner generieren und APK bauen
        run: |
          # Generiert den sauberen Android-Ordner passend zum Projekt
          flutter create . --platforms=android --project-name streamia --org com.streamia.player
          
          flutter pub get
          flutter build apk --release

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: streamia-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
