name: Build Streamia APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Projektdateien laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Android-Ordner & Internet-Rechte erzeugen
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.streamia.app --project-name streamia .
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/g' "$MANIFEST"
          fi

      - name: 5. Eigenes App-Icon in den Android-Ordner einbauen
        run: |
          if [ -f "assets/images/app_logo.jpg" ] && ! grep -q "flutter_launcher_icons:" pubspec.yaml; then
            flutter pub add --dev flutter_launcher_icons
            printf "\nflutter_launcher_icons:\n  android: true\n  image_path: \"assets/images/app_logo.jpg\"\n  min_sdk_android: 21\n" >> pubspec.yaml
            flutter pub get
            dart run flutter_launcher_icons || true
          else
            flutter pub get
          fi

      - name: 6. Android-Ordner dauerhaft im GitHub-Repository speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/ pubspec.yaml
          if ! git diff --staged --quiet; then
            git commit -m "Android-Ordner und App-Icon dauerhaft im Projekt gespeichert [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: 7. APK-Datei bauen
        run: flutter build apk --release

      - name: 8. Fertige APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: streamia-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
